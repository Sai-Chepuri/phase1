[project]
name = "phase1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Monish", email = "sai.chepuri6@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
phase1 = "phase1:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]   # errors, pyflakes, import sort, modernize, bugbear, simplify

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
